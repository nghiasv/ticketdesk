[project]
name = "ticketdesk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nghiasv", email = "doankimnghia1908@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
ticketdesk = "ticketdesk:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.ruff]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Django khai báo cấu hình class bằng list (list_display, fields...), không phải lỗi thật
ignore = ["RUF012"]
